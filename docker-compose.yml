services:
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/database:/app/database
      - ./backend/logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PDF_PATH=/app/database/medical_book.pdf
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - KEYWORD_BACKEND=elasticsearch
      - ES_ENABLED=true
      - ES_HOST=http://elasticsearch:9200
      - RERANKER_MODEL_ENABLED=true
      - QUERY_REWRITER_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  redis-data:
  elasticsearch-data:
